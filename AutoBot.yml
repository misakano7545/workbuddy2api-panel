  # 每片 4 个仓串行：串行是硬要求（免费档 10 RPM 共享一个池），
  # 放大每片只为少付 setup 开销（每片一次 pip install ≈2 分钟）
  shard_size: 4
  # 每轮最多真正落地几条（每条要起 agent 写代码、跑测试、开 PR）。
  # 每条最坏 60 分钟（方案 30 + diff 30）——抬到 3 就必须同步抬 implement 的
  # job 超时，否则第 3 条落地到一半被 job 超时掐掉，前两条也白跑。
  # 注意：值得度同分（本轮 60/89 都是 3）时排序退化成文件名字母序，选哪三条
  # 没有语义，只是「同分里的三条」。
  land_max: 3

policy:
  base: main
  branch_prefix: autobot/
  label: autobot

  # 硬禁项：这是给执行者的线，不是提示词里的软约束
  never:
    - push_main
    - merge
    - tag
    - release
    - deploy
    - .github/workflows/**
    - AGENTS.md
    - config.example.json

  # 「不做」清单：不是禁动作，是这个仓明确不要的能力。加一条只改这里。
  # 三处都生效：分析提示词里带上（免得 agent 给 3 分）、报告命中的不落地（省掉 30 分钟实现）、
  # 改动命中的在提交前驳回（报告写得干净、实现照做的也兜得住）。
  # match 是不区分大小写的子串，会在报告正文和 diff 里各扫一遍。
  off_limits:
    - name: 多密钥 / 多人共用
      why: 本仓只有一把管理员 api_key（httpauth.VerifyBearer 单串比对），不提供按人分发密钥、按人计量与限额。要多人用就自己搭一层反代。
      match:
        - client_keys
        - clientkeys
        - ClientKey
        - api_keys
        - admin_key_required
        - 客户端密钥
        - 多密钥
        - 多 API Key
        - 按人计量
        - 按人限额