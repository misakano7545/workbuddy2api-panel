name: binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build
        run: |
          set -euo pipefail
          # ponytail: 上游 Release 只有 Windows 包，里面三个文件。
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o wb2api.exe ./cmd/server
          mkdir -p dist
          python3 -c 'import os,zipfile; n="dist/wb2api-panel-"+os.environ["GITHUB_REF_NAME"]+"-windows-amd64.zip"; z=zipfile.ZipFile(n,"w",zipfile.ZIP_DEFLATED); [z.write(f) for f in ("wb2api.exe","config.example.json","README.md")]; z.close()'

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*
          if-no-files-found: error

      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
