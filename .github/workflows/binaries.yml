name: binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build
        run: |
          set -euo pipefail
          # ponytail: 包结构跟上游一样；主程序分 windows/linux，amd64。
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o wb2api.exe ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o wb2api ./cmd/server
          mkdir -p dist
          pack() {
            python3 -c 'import sys,zipfile; n,b=sys.argv[1:]; z=zipfile.ZipFile(n,"w",zipfile.ZIP_DEFLATED); [z.write(f) for f in (b,"config.example.json","README.md")]; z.close()' \
              "dist/wb2api-panel-${GITHUB_REF_NAME}-$1-amd64.zip" "$2"
          }
          pack windows wb2api.exe
          pack linux wb2api

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*
          if-no-files-found: error

      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
