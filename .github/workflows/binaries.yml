name: binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build
        run: |
          set -euo pipefail
          # ponytail: 包结构跟上游一样；主程序 windows/linux × amd64/arm64。
          mkdir -p dist
          pack() {
            dir="dist/$1-$2"
            mkdir -p "$dir"
            cp "$3" "$dir/"
            cp config.example.json README.md "$dir/"
            python3 -c 'import os,sys,zipfile; n,d=sys.argv[1:]; z=zipfile.ZipFile(n,"w",zipfile.ZIP_DEFLATED); [z.write(os.path.join(d,f), f) for f in os.listdir(d)]; z.close()' \
              "dist/wb2api-panel-${GITHUB_REF_NAME}-$1-$2.zip" "$dir"
          }
          for os in windows linux; do
            bin=wb2api
            [ "$os" = windows ] && bin=wb2api.exe
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath -ldflags="-s -w" -o "$bin" ./cmd/server
              pack "$os" "$arch" "$bin"
            done
          done

      # ponytail: 四个 upload，每个系统架构一个 artifact。matrix 等构建时间不够再用。
      - uses: actions/upload-artifact@v4
        with:
          name: wb2api-panel-${{ github.ref_name }}-windows-amd64
          path: dist/windows-amd64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wb2api-panel-${{ github.ref_name }}-windows-arm64
          path: dist/windows-arm64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wb2api-panel-${{ github.ref_name }}-linux-amd64
          path: dist/linux-amd64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wb2api-panel-${{ github.ref_name }}-linux-arm64
          path: dist/linux-arm64
          if-no-files-found: error

      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
