name: docker-ghcr

# 多架构镜像（amd64/arm64）自动构建并发布到 ghcr.io：
#   - push 到 main / 打 v* tag / 手动触发 → 构建并推送
#   - PR 触碰构建相关文件 → 仅构建验证，不推送
# tag 说明：main 推 latest + main + sha-xxxxxx；时间标签 v2026.9.26.711 推同名镜像 tag
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - ".github/workflows/autobot.yml"
      - "AutoBot.yml"
      - "scripts/autobot.py"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "scripts/**"
      - "*.sh"
      - "config.example.json"
      - ".github/workflows/docker-ghcr.yml"
  workflow_dispatch:

# 并发组：PR 取消过时构建；main/tag 按引用串行——发版时 main+tag 同推不再双跑
# 同一份代码的多架构构建（QEMU arm64 一次不便宜）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # github.repository 自动小写化，得到 ghcr.io/misakano7545/workbuddy2api-panel
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（arm64 交叉模拟）
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=$(TZ=Asia/Shanghai date +%Y.%-m.%-d.%-H%M)" >> "$GITHUB_ENV"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=match,pattern=v(.*),group=1
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ env.APP_VERSION }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 关闭 provenance attestation：避免 ghcr 页面出现 unknown/unknown 架构条目
          provenance: false
